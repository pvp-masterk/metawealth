<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VANTAGE // Pro Terminal</title>
<style>
/* --- CORE THEME --- */
:root {
    --bg-dark: #09090b;
    --bg-panel: #121214;
    --border: #27272a;
    --primary: #3b82f6;
    --text-main: #e4e4e7;
    --text-mute: #71717a;
    
    --tick-up: #10b981;    /* Green */
    --tick-down: #ef4444;  /* Red */
    --tick-up-glow: rgba(16, 185, 129, 0.15);
    --tick-down-glow: rgba(239, 68, 68, 0.15);
}

body {
    margin: 0;
    background: var(--bg-dark);
    color: var(--text-main);
    font-family: 'JetBrains Mono', 'Consolas', monospace; /* Monospace for financial data */
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* --- LAYOUT GRID --- */
.app-grid {
    display: grid;
    grid-template-columns: 300px 1fr 320px;
    grid-template-rows: 60px 1fr;
    height: 100%;
    width: 100%;
}

/* --- HEADER --- */
header {
    grid-column: 1 / -1;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    justify-content: space-between;
}

.brand { font-weight: 800; letter-spacing: -1px; font-size: 1.2rem; }
.brand span { color: var(--primary); }
.account-summary { display: flex; gap: 20px; font-size: 0.9rem; }
.acc-val { color: var(--text-main); font-weight: 700; }

/* --- SIDEBARS --- */
.sidebar {
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

.sidebar-right {
    border-right: none;
    border-left: 1px solid var(--border);
}

.panel-head {
    padding: 12px 15px;
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-mute);
    letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    position: sticky;
    top: 0;
}

/* --- STOCK LIST --- */
.ticker-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    padding: 12px 15px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: 0.1s;
    font-size: 0.9rem;
}
.ticker-row:hover { background: rgba(255,255,255,0.05); }
.ticker-row.active { background: rgba(59, 130, 246, 0.1); border-left: 2px solid var(--primary); }

.t-sym { font-weight: 700; }
.t-price { text-align: right; }
.t-chg { text-align: right; }

.up { color: var(--tick-up); }
.down { color: var(--tick-down); }

/* --- MAIN CHART AREA --- */
.main-stage {
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg-dark);
}

.chart-header {
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--border);
}

.symbol-big { font-size: 2rem; font-weight: 800; line-height: 1; }
.price-big { font-size: 2rem; font-weight: 400; font-family: 'Consolas', monospace; }

#candleChart {
    width: 100%;
    flex: 1; /* Fills remaining height */
    cursor: crosshair;
}

/* --- ORDER CONTROLS --- */
.order-dock {
    height: 80px;
    border-top: 1px solid var(--border);
    background: var(--bg-panel);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.btn {
    border: none;
    padding: 0 20px;
    height: 40px;
    border-radius: 4px;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.85rem;
    transition: 0.2s;
    text-transform: uppercase;
    color: #fff;
}
.btn-buy { background: var(--tick-up); }
.btn-buy:hover { background: #059669; }
.btn-sell { background: var(--tick-down); }
.btn-sell:hover { background: #dc2626; }
.btn-close { background: var(--text-mute); }
.btn-close:hover { background: #52525b; }

.input-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.input-group label { font-size: 0.7rem; color: var(--text-mute); }
input[type="number"] {
    background: #000;
    border: 1px solid var(--border);
    color: white;
    padding: 8px;
    border-radius: 4px;
    width: 100px;
    font-family: monospace;
}

/* --- PORTFOLIO & LOGS --- */
.position-card {
    padding: 15px;
    border-bottom: 1px solid var(--border);
}
.pos-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
.pos-pnl { font-size: 0.85rem; text-align: right; }

.toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
    z-index: 99;
}
.toast {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 12px 20px;
    border-radius: 6px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
    font-size: 0.85rem;
    animation: slideIn 0.3s ease-out;
    border-left: 4px solid var(--primary);
}
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

</style>
</head>
<body>

<div class="app-grid">
    <!-- Header -->
    <header>
        <div class="brand"><span>//</span> VANTAGE TERM</div>
        <div class="account-summary">
            <div>LIQUID: <span id="ui-cash" class="acc-val">$0.00</span></div>
            <div>NET LIQ: <span id="ui-equity" class="acc-val">$0.00</span></div>
            <div>P&L: <span id="ui-pnl" class="acc-val">0.00%</span></div>
        </div>
    </header>

    <!-- Left: Market Watch -->
    <aside class="sidebar">
        <div class="panel-head">Market Watch</div>
        <div id="market-list"></div>
    </aside>

    <!-- Center: Chart & execution -->
    <main class="main-stage">
        <div class="chart-header">
            <div>
                <div class="symbol-big" id="active-symbol">---</div>
                <div style="font-size:0.8rem; color:var(--text-mute)" id="active-name">Select Ticker</div>
            </div>
            <div class="price-big" id="active-price">---</div>
        </div>
        
        <canvas id="candleChart"></canvas>

        <div class="order-dock">
            <div class="input-group">
                <label>QUANTITY</label>
                <input type="number" id="order-qty" value="10" min="1">
            </div>
            <button class="btn btn-buy" onclick="executeOrder('BUY')">Buy / Cover</button>
            <button class="btn btn-sell" onclick="executeOrder('SELL')">Sell / Short</button>
            <div style="flex:1"></div>
            <button class="btn btn-close" onclick="maxOrder()">Max Qty</button>
        </div>
    </main>

    <!-- Right: Portfolio -->
    <aside class="sidebar sidebar-right">
        <div class="panel-head">Open Positions</div>
        <div id="portfolio-list">
            <div style="padding:20px; color:var(--text-mute); text-align:center">No open positions</div>
        </div>
        <div class="panel-head" style="margin-top:auto">Trade Log</div>
        <div id="trade-log" style="height: 150px; font-size: 0.75rem; padding: 10px; color: var(--text-mute); overflow-y:auto"></div>
    </aside>
</div>

<div class="toast-container" id="toaster"></div>

<script>
/* --- CONFIGURATION --- */
const CONFIG = {
    tickRate: 200,      // ms per tick (sim speed)
    candleSize: 10,     // ticks per candle
    maxCandles: 80,     // max candles on chart
    startCash: 50000
};

/* --- STATE MANAGEMENT --- */
const store = {
    cash: CONFIG.startCash,
    equity: CONFIG.startCash,
    startEquity: CONFIG.startCash,
    selectedSymbol: 'NVDA',
    positions: {}, // { 'AAPL': 10, 'TSLA': -5 } (Negative = Short)
    stocks: [
        { sym: 'NVDA', name: 'Nvidia Corp', price: 850.00, vol: 0.004, drift: 0.0002, candles: [] },
        { sym: 'TSLA', name: 'Tesla Inc',   price: 175.00, vol: 0.008, drift: 0.0000, candles: [] },
        { sym: 'AAPL', name: 'Apple Inc',   price: 170.00, vol: 0.002, drift: 0.0001, candles: [] },
        { sym: 'AMD',  name: 'Adv Micro',   price: 180.00, vol: 0.005, drift: 0.0002, candles: [] },
        { sym: 'GME',  name: 'GameStop',    price: 15.00,  vol: 0.020, drift: 0.0000, candles: [] },
        { sym: 'BTC',  name: 'Bitcoin',     price: 65000,  vol: 0.010, drift: 0.0005, candles: [] },
    ],
    currentCandleTick: 0
};

// Initialize Stocks with empty candles
store.stocks.forEach(s => {
    s.currentCandle = { o: s.price, h: s.price, l: s.price, c: s.price };
    // Generate some history
    let tempPrice = s.price;
    for(let i=0; i<CONFIG.maxCandles; i++) {
        let open = tempPrice;
        let close = open * (1 + (Math.random()-0.5)*s.vol*3);
        s.candles.push({
            o: open, 
            h: Math.max(open, close) + Math.random(), 
            l: Math.min(open, close) - Math.random(), 
            c: close 
        });
        tempPrice = close;
    }
    s.price = tempPrice;
});

/* --- SIMULATION ENGINE --- */
function tick() {
    // 1. Market Mechanics (Geometric Brownian Motion)
    store.stocks.forEach(s => {
        // Random Walk Math
        const shock = (Math.random() - 0.5) * 2; // -1 to 1
        const changePct = (s.drift) + (s.vol * shock);
        s.price = s.price * (1 + changePct);
        
        // Update Current Candle
        const c = s.currentCandle;
        c.c = s.price;
        if(s.price > c.h) c.h = s.price;
        if(s.price < c.l) c.l = s.price;
    });

    // 2. Candle Management
    store.currentCandleTick++;
    if(store.currentCandleTick >= CONFIG.candleSize) {
        store.stocks.forEach(s => {
            s.candles.push({...s.currentCandle}); // Commit candle
            if(s.candles.length > CONFIG.maxCandles) s.candles.shift();
            // Start new candle
            s.currentCandle = { o: s.price, h: s.price, l: s.price, c: s.price };
        });
        store.currentCandleTick = 0;
    }

    // 3. Portfolio Calculation
    let positionsValue = 0;
    Object.keys(store.positions).forEach(sym => {
        const qty = store.positions[sym];
        const stock = store.stocks.find(s => s.sym === sym);
        if(stock) positionsValue += (stock.price * qty);
    });
    store.equity = store.cash + positionsValue;

    // 4. Render Updates
    updateUI();
    drawChart();
}

/* --- RENDERING --- */
function updateUI() {
    // Header
    document.getElementById('ui-cash').innerText = formatCurrency(store.cash);
    document.getElementById('ui-equity').innerText = formatCurrency(store.equity);
    const pnl = ((store.equity - store.startEquity) / store.startEquity) * 100;
    const pnlEl = document.getElementById('ui-pnl');
    pnlEl.innerText = (pnl > 0 ? "+" : "") + pnl.toFixed(2) + "%";
    pnlEl.className = "acc-val " + (pnl >= 0 ? "up" : "down");

    // Market List
    const list = document.getElementById('market-list');
    list.innerHTML = "";
    store.stocks.forEach(s => {
        const isActive = s.sym === store.selectedSymbol;
        const prevClose = s.candles[s.candles.length-1].c;
        const change = ((s.price - prevClose)/prevClose)*100;
        const color = change >= 0 ? 'up' : 'down';
        
        const el = document.createElement('div');
        el.className = `ticker-row ${isActive ? 'active' : ''}`;
        el.onclick = () => { store.selectedSymbol = s.sym; drawChart(); };
        el.innerHTML = `
            <div class="t-sym">${s.sym}</div>
            <div class="t-price ${color}">${s.price.toFixed(2)}</div>
            <div class="t-chg ${color}">${change > 0 ? '+' : ''}${change.toFixed(2)}%</div>
        `;
        list.appendChild(el);
    });

    // Chart Header
    const activeStock = store.stocks.find(s => s.sym === store.selectedSymbol);
    document.getElementById('active-symbol').innerText = activeStock.sym;
    document.getElementById('active-name').innerText = activeStock.name;
    const priceEl = document.getElementById('active-price');
    priceEl.innerText = activeStock.price.toFixed(2);
    priceEl.className = "price-big " + (activeStock.price >= activeStock.currentCandle.o ? "up" : "down");

    // Portfolio List
    const portList = document.getElementById('portfolio-list');
    const posKeys = Object.keys(store.positions).filter(k => store.positions[k] !== 0);
    
    if(posKeys.length === 0) {
        portList.innerHTML = `<div style="padding:20px; color:var(--text-mute); text-align:center">No open positions</div>`;
    } else {
        portList.innerHTML = "";
        posKeys.forEach(sym => {
            const qty = store.positions[sym];
            const stock = store.stocks.find(s => s.sym === sym);
            const marketVal = stock.price * qty;
            const side = qty > 0 ? "LONG" : "SHORT";
            const sideColor = qty > 0 ? "up" : "down";
            
            portList.innerHTML += `
                <div class="position-card">
                    <div class="pos-header">
                        <span style="font-weight:bold">${sym}</span>
                        <span class="${sideColor}" style="font-size:0.8em; border:1px solid; padding:0 4px; border-radius:3px">${side}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:0.9rem">
                        <span style="color:var(--text-mute)">${Math.abs(qty)} Shares</span>
                        <span style="font-weight:700">${formatCurrency(marketVal)}</span>
                    </div>
                </div>
            `;
        });
    }
}

/* --- CHART ENGINE (CANVAS) --- */
function drawChart() {
    const canvas = document.getElementById('candleChart');
    const ctx = canvas.getContext('2d');
    const parent = canvas.parentElement;
    
    // Responsive Canvas
    canvas.width = parent.clientWidth;
    canvas.height = parent.clientHeight; // minus header

    const stock = store.stocks.find(s => s.sym === store.selectedSymbol);
    const data = [...stock.candles, stock.currentCandle];
    
    // Scale Math
    const allPrices = data.flatMap(c => [c.l, c.h]);
    let min = Math.min(...allPrices);
    let max = Math.max(...allPrices);
    const range = max - min;
    const padding = range * 0.1;
    min -= padding; max += padding;

    const w = canvas.width;
    const h = canvas.height;
    const candleWidth = (w / data.length) * 0.7;
    const spacing = (w / data.length);

    ctx.clearRect(0,0,w,h);

    // Draw Grid (simple)
    ctx.strokeStyle = '#27272a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let i=1; i<5; i++){
        const y = (h/5)*i;
        ctx.moveTo(0, y); ctx.lineTo(w, y);
    }
    ctx.stroke();

    // Draw Candles
    data.forEach((c, i) => {
        const x = i * spacing + (spacing/2);
        const yHigh = h - ((c.h - min) / (max - min)) * h;
        const yLow = h - ((c.l - min) / (max - min)) * h;
        const yOpen = h - ((c.o - min) / (max - min)) * h;
        const yClose = h - ((c.c - min) / (max - min)) * h;

        const isUp = c.c >= c.o;
        ctx.fillStyle = isUp ? '#10b981' : '#ef4444';
        ctx.strokeStyle = ctx.fillStyle;

        // Wick
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();

        // Body
        const bodyTop = Math.min(yOpen, yClose);
        const bodyHeight = Math.abs(yClose - yOpen);
        // Ensure even doji has 1px height
        ctx.fillRect(x - candleWidth/2, bodyTop, candleWidth, Math.max(1, bodyHeight));
    });
    
    // Current Price Line
    const yCurrent = h - ((stock.price - min) / (max - min)) * h;
    ctx.strokeStyle = '#3b82f6';
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(0, yCurrent);
    ctx.lineTo(w, yCurrent);
    ctx.stroke();
    ctx.setLineDash([]);
}

/* --- TRADING LOGIC --- */
function executeOrder(side) {
    const qtyInput = document.getElementById('order-qty');
    const qty = parseInt(qtyInput.value);
    if(qty <= 0) return;

    const stock = store.stocks.find(s => s.sym === store.selectedSymbol);
    const cost = stock.price * qty;

    // BUY LOGIC (Buy to open OR Buy to cover)
    if (side === 'BUY') {
        const currentPos = store.positions[stock.sym] || 0;
        
        // If Short, this is covering. If Long or Flat, check cash.
        if (currentPos < 0) {
            // Covering short
            store.cash -= cost; // You pay money to buy back
            store.positions[stock.sym] += qty;
            toast(`BOUGHT TO COVER ${qty} ${stock.sym}`, 'neutral');
        } else {
            // Buying long
            if(store.cash >= cost) {
                store.cash -= cost;
                store.positions[stock.sym] = currentPos + qty;
                toast(`BOUGHT ${qty} ${stock.sym} @ ${stock.price.toFixed(2)}`, 'success');
            } else {
                toast('INSUFFICIENT FUNDS', 'error');
                return;
            }
        }
    } 
    // SELL LOGIC (Sell to close OR Sell Short)
    else if (side === 'SELL') {
        const currentPos = store.positions[stock.sym] || 0;
        
        // If Long, selling to close.
        if (currentPos > 0) {
             store.cash += cost;
             store.positions[stock.sym] -= qty;
             toast(`SOLD ${qty} ${stock.sym}`, 'error'); // Red for sell
        } else {
            // Opening Short position
            // Margin Requirement check (simplified: need 50% cash of short value)
            if (store.cash >= cost * 0.5) {
                store.cash += cost; // You get cash now (liability created)
                store.positions[stock.sym] = currentPos - qty;
                toast(`SHORTED ${qty} ${stock.sym} @ ${stock.price.toFixed(2)}`, 'neutral');
            } else {
                toast('INSUFFICIENT MARGIN', 'error');
            }
        }
    }
    
    logTrade(side, stock.sym, qty, stock.price);
    updateUI();
}

function maxOrder() {
    const stock = store.stocks.find(s => s.sym === store.selectedSymbol);
    // Simple logic: Max buy with current cash
    const maxQty = Math.floor(store.cash / stock.price);
    if(maxQty > 0) document.getElementById('order-qty').value = maxQty;
}

/* --- UTILS --- */
function formatCurrency(num) {
    return '$' + num.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerText = msg;
    if(type === 'error') el.style.borderLeftColor = '#ef4444';
    if(type === 'neutral') el.style.borderLeftColor = '#e4e4e7';
    document.getElementById('toaster').appendChild(el);
    setTimeout(() => el.remove(), 3000);
}

function logTrade(action, sym, qty, price) {
    const log = document.getElementById('trade-log');
    const time = new Date().toLocaleTimeString().split(' ')[0];
    log.innerHTML = `<div style="border-bottom:1px solid #333; padding:4px 0">
        <span style="color:#666">[${time}]</span> 
        <b>${action}</b> ${qty} ${sym} @ ${price.toFixed(2)}
    </div>` + log.innerHTML;
}

// Start
setInterval(tick, CONFIG.tickRate);
tick(); // First run
</script>

</body>
</html>
