<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stock Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #0b0f14;
  --card: #121822;
  --accent: #3cff88;
  --danger: #ff4d4d;
  --text: #e6ebf2;
}

* {
  box-sizing: border-box;
  font-family: Inter, system-ui, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

header {
  padding: 20px;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  background: linear-gradient(90deg, #0f172a, #020617);
}

.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  padding: 20px;
}

.card {
  background: var(--card);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
}

.balance {
  font-size: 20px;
  margin-bottom: 12px;
}

.stock {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 8px;
  background: rgba(255,255,255,0.03);
}

.stock span {
  font-weight: 500;
}

button {
  background: var(--accent);
  border: none;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

.sell {
  background: var(--danger);
  color: white;
}

.chart {
  height: 140px;
  display: flex;
  align-items: flex-end;
  gap: 4px;
}

.bar {
  width: 100%;
  background: linear-gradient(180deg, #3cff88, #1a7f4d);
  border-radius: 4px 4px 0 0;
  transition: height 0.3s;
}

.portfolio-item {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
}

footer {
  text-align: center;
  opacity: 0.4;
  font-size: 12px;
  padding: 10px;
}
</style>
</head>

<body>

<header>📈 Stock Market Simulator</header>

<div class="container">

  <div class="card">
    <div class="balance">💰 Balance: $<span id="balance">10000</span></div>
    <div id="stocks"></div>
  </div>

  <div class="card">
    <h3>📊 Market Chart</h3>
    <div class="chart" id="chart"></div>
    <h3 style="margin-top:16px">📦 Portfolio</h3>
    <div id="portfolio"></div>
  </div>

</div>

<footer>Simulated market • No real money involved</footer>

<script>
let balance = Number(localStorage.getItem("balance")) || 10000;
let portfolio = JSON.parse(localStorage.getItem("portfolio")) || {};

const stocks = [
  { symbol: "SIX", price: 120, vol: 2 },
  { symbol: "NOVA", price: 60, vol: 4 },
  { symbol: "VOID", price: 200, vol: 1.5 },
  { symbol: "CRON", price: 35, vol: 6 }
];

const history = [];

function save() {
  localStorage.setItem("balance", balance);
  localStorage.setItem("portfolio", JSON.stringify(portfolio));
}

function updateMarket() {
  stocks.forEach(s => {
    const change = (Math.random() - 0.5) * s.vol;
    s.price = Math.max(1, s.price + change);
  });

  history.push(stocks.reduce((a,b)=>a+b.price,0));
  if (history.length > 30) history.shift();

  render();
  save();
}

function buy(stock) {
  if (balance >= stock.price) {
    balance -= stock.price;
    portfolio[stock.symbol] = (portfolio[stock.symbol] || 0) + 1;
  }
}

function sell(stock) {
  if (portfolio[stock.symbol] > 0) {
    portfolio[stock.symbol]--;
    balance += stock.price;
  }
}

function render() {
  document.getElementById("balance").textContent = balance.toFixed(2);

  const stocksDiv = document.getElementById("stocks");
  stocksDiv.innerHTML = "";

  stocks.forEach(s => {
    const el = document.createElement("div");
    el.className = "stock";
    el.innerHTML = `
      <span>${s.symbol} — $${s.price.toFixed(2)}</span>
      <div>
        <button onclick="buy(stocks.find(x=>x.symbol==='${s.symbol}'))">Buy</button>
        <button class="sell" onclick="sell(stocks.find(x=>x.symbol==='${s.symbol}'))">Sell</button>
      </div>
    `;
    stocksDiv.appendChild(el);
  });

  const port = document.getElementById("portfolio");
  port.innerHTML = "";
  Object.keys(portfolio).forEach(sym => {
    if (portfolio[sym] > 0) {
      port.innerHTML += `
        <div class="portfolio-item">
          <span>${sym}</span>
          <span>${portfolio[sym]} shares</span>
        </div>
      `;
    }
  });

  const chart = document.getElementById("chart");
  chart.innerHTML = "";
  const max = Math.max(...history, 1);
  history.forEach(v => {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.height = (v / max * 100) + "%";
    chart.appendChild(bar);
  });
}

render();
setInterval(updateMarket, 1000);
</script>

</body>
</html>
